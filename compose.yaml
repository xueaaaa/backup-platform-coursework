name: coursework-backup
x-backup-env: &backup-env
  TZ: Europe/Moscow
  SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:?Создайте .env из .env.example}
  RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?Задайте пароль тестовой БД}
  BORG_PASSPHRASE: ${BORG_PASSPHRASE:?Задайте пароль шифрования}
services:
  panel:
    build:
      context: .
      target: panel
    environment:
      <<: *backup-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Задайте ключ Django}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте пароль администратора}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - panel-state:/state
      - backup-configs:/configs
      - backup-cron:/cron
      - backup-logs:/logs
      - backup-repository:/repository
      - backup-locks:/locks
      - borg-home:/borg-home
    networks: [backup-net]
    depends_on:
      source-db: {condition: service_healthy}
      restore-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 45s
    restart: unless-stopped
  scheduler:
    build:
      context: .
      target: engine
    environment: *backup-env
    volumes:
      - backup-configs:/configs:ro
      - backup-cron:/etc/cron.d:ro
      - backup-logs:/logs
      - backup-repository:/repository
      - backup-locks:/locks
      - borg-home:/borg-home
    networks: [backup-net]
    depends_on:
      panel: {condition: service_healthy}
    stop_grace_period: 1m
    restart: unless-stopped
  source-db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_DB: coursework
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:?Задайте пароль исходной БД}
      TZ: Europe/Moscow
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./infra/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U backup -d coursework']
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [backup-net]
    restart: unless-stopped
  restore-db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_DB: coursework
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: ${RESTORE_DB_PASSWORD:?Задайте пароль тестовой БД}
      TZ: Europe/Moscow
    volumes: [restore-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U backup -d coursework']
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [backup-net]
    restart: unless-stopped
  proxy:
    image: nginx:stable-bookworm
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - panel-state:/state:ro
    networks: [backup-net]
    depends_on:
      panel: {condition: service_healthy}
    restart: unless-stopped
networks:
  backup-net:
    driver: bridge
volumes:
  panel-state:
  backup-configs:
  backup-cron:
  backup-logs:
  backup-repository:
  backup-locks:
  borg-home:
  source-data:
  restore-data:
