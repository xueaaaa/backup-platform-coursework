server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    location /static/ {
        alias /state/static/;
        expires 1d;
    }
    location / {
        proxy_pass http://panel:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 210s;
        proxy_connect_timeout 10s;
    }
}
