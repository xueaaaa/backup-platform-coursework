<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Резерв — управление копиями{% endblock %}</title>
<style>
:root{color-scheme:light;--ink:#19253b;--muted:#657189;--line:#dfe5ed;--blue:#2459ca;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{background:#fff;border-bottom:1px solid var(--line)}nav{max-width:1120px;margin:auto;padding:19px 28px;display:flex;align-items:center;gap:24px}.brand{font-size:22px;font-weight:750;color:var(--ink)}.grow{flex:1}.muted,small{color:var(--muted)}main{max-width:1120px;margin:40px auto;padding:0 28px 60px}h1{font-size:30px;line-height:1.2;letter-spacing:-.6px;margin:0 0 12px}h2{font-size:19px;margin:0 0 18px}p{margin:0 0 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;margin-bottom:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.number{display:block;font-size:30px;font-weight:700;margin-bottom:4px}.pill{font-size:12px;font-weight:600;border-radius:30px;padding:4px 10px;background:#e9edf4;white-space:nowrap}.active,.success{background:#e5f4eb;color:#20613a}.error{background:#fcebea;color:#9b3029}.button,button{display:inline-block;border:0;border-radius:7px;background:var(--blue);color:white;padding:10px 16px;font:600 14px system-ui;cursor:pointer}.button:hover{text-decoration:none;background:#1947ad}.secondary{background:#edf1f8;color:#28436d}.danger{background:#9c342f}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions form,nav form{margin:0}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--muted);font-weight:600}td,th{padding:14px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.table-wrap{overflow-x:auto}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{padding:13px 18px;border-radius:8px;background:#eaf0fc;margin:0 0 18px}.form{max-width:680px}.form p{margin-bottom:22px}label{display:block;font-weight:600;margin-bottom:7px}input,select{font:inherit;border:1px solid #bcc6d5;border-radius:7px;padding:10px 12px;max-width:100%;width:100%;background:#fff;color:var(--ink)}input[type=checkbox]{width:auto}input[type=checkbox]+label{display:inline}.helptext{display:block;font-size:13px;color:var(--muted);margin-top:5px}.errorlist{color:#a03030;padding-left:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;border:1px solid var(--line);padding:16px;border-radius:7px;font:12px/1.65 Consolas,monospace;max-height:360px;overflow:auto}summary{cursor:pointer}details{padding:12px 0;border-top:1px solid var(--line)}.login{max-width:420px;margin:70px auto}.engine{padding:16px 0;color:var(--muted);font-size:13px}.inline{display:inline}.compact{font-size:13px}.restore{border-left:3px solid #d4a45e;padding-left:18px}code{font-family:Consolas,monospace}footer{color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:680px){nav{padding:15px 18px;gap:12px}main{padding:0 18px;margin-top:26px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:25px}.card{padding:18px}}
</style></head><body>
<header><nav><a class="brand" href="{% url 'dashboard' %}">◈ Резерв</a><span class="muted compact">Панель управления</span><span class="grow"></span>{% if user.is_authenticated %}<span class="compact">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Выйти</button></form>{% endif %}</nav></header>
<main>{% for message in messages %}<div class="notice {{ message.tags }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}<footer>Учебная платформа резервного копирования · BorgBackup + borgmatic</footer></main></body></html>
